services:
  redis:
    image: redis:7-alpine
    container_name: cosmetics_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: cosmetics_api
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      QWEN_LLM_BASE_URL: http://<GCP_IP>:11434/v1
    ports:
      - "8000:8000"
