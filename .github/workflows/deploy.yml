name: Deploy to EC2

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      force_ai:
        description: 'AI 이미지 강제 재빌드'
        type: boolean
        default: false

env:
  IMAGE_BE: ghcr.io/csid-dgu/2026-1-cecd1-3-uhoo-08/be
  IMAGE_AI: ghcr.io/csid-dgu/2026-1-cecd1-3-uhoo-08/ai

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ai:
              - 'AI/**'

  build:
    needs: changes     # AI 이미지 조건부 빌드 판단에만 사용
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: BE 이미지 빌드 & push
        uses: docker/build-push-action@v6
        with:
          context: ./BE
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_BE }}:latest
          cache-from: type=gha,scope=be
          cache-to: type=gha,mode=max,scope=be

      - name: AI 이미지 빌드 & push
        if: needs.changes.outputs.ai == 'true' || inputs.force_ai
        uses: docker/build-push-action@v6
        with:
          context: ./AI
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_AI }}:latest
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GHCR 이미지 존재 확인
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
          MISSING=0
          for IMG in "${{ env.IMAGE_BE }}:latest" "${{ env.IMAGE_AI }}:latest"; do
            if docker manifest inspect "$IMG" > /dev/null 2>&1; then
              echo "OK       $IMG"
            else
              echo "MISSING  $IMG"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "GHCR에 이미지가 없습니다."
            echo "Actions 탭 > Run workflow > force_ai 체크 후 실행하세요."
            exit 1
          fi

      - name: deploy 파일 동기화
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile"
          target: "~/app/"

      - name: EC2 pull & 재기동
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/app/deploy
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

            echo "헬스체크 시작"
            for i in $(seq 1 24); do
              if docker compose -f docker-compose.prod.yml exec -T caddy \
                   wget -q -O /dev/null http://backend:8080/api-docs 2>/dev/null; then
                echo "배포 성공 ($i번째 시도)"
                docker compose -f docker-compose.prod.yml ps
                exit 0
              fi
              echo "대기 중 ($i/24)"
              sleep 5
            done

            echo "헬스체크 실패"
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=80 backend
            exit 1